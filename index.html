
< 

  <option value="mystère">🔎 Mystère</option>
  <option value="magie">✨ Magie</option>
  <option value="action">⚡ Action</option>
</select>

<label for="idea">Ton idée d'histoire (facultatif)</label>
<textarea id="idea" placeholder="Exemple : une fraise découvre un monde secret..."></textarea>

<button onclick="createStory()">✨ Créer mon histoire</button>

<div id="result"></div>
</div>

<div class="card">
<h2>📚 Mes histoires sauvegardées</h2>
<div id="savedStories"></div>
</div>

<footer>🍓 Frutanzia — Imagine, crée et raconte !</footer>

</div>

<script>
function createStory() {
  const fruit = document.getElementById("fruit").value;
  const style = document.getElementById("style").value;
  const idea = document.getElementById("idea").value.trim();

  const openings = {
    comique: "Un jour, tout le monde se mit à rire dans le royaume des fruits.",
    aventure: "Un matin, une grande aventure commença dans la forêt magique.",
    "amitié": "Dans un petit village, une belle amitié allait naître.",
    mystère: "Un étrange secret venait d'être découvert.",
    magie: "Une mystérieuse lumière magique apparut dans le ciel.",
    action: "Une mission importante venait de commencer."
  };

  const story = `${fruit} était un personnage très courageux.

${openings[style]}

${idea || "Il décida de partir à la découverte d'un monde merveilleux."}

Sur son chemin, il rencontra de nouveaux amis et surmonta plusieurs défis.

À la fin, il découvrit que le courage et l'amitié pouvaient tout changer.

🌟 FIN 🌟`;

  document.getElementById("result").innerHTML = `
    <div class="story">
      <h3>🎬 Ton histoire</h3>
      <p>${escapeHTML(story)}</p>
      <button onclick="saveStory()">💾 Sauvegarder</button>
    </div>
  `;

  window.currentStory = story;
}

function escapeHTML(text) {
  return text.replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function saveStory() {
  if (!window.currentStory) return;

  const stories = JSON.parse(
    localStorage.getItem("frutanziaStories") || "[]"
  );

  stories.unshift(window.currentStory);

  localStorage.setItem(
    "frutanziaStories",
    JSON.stringify(stories)
  );

  showStories();
  alert("Histoire sauvegardée !");
}

function showStories() {
  const stories = JSON.parse(
    localStorage.getItem("frutanziaStories") || "[]"
  );

  const area = document.getElementById("savedStories");

  if (stories.length === 0) {
    area.textContent = "Aucune histoire sauvegardée pour le moment.";
    return;
  }

  area.innerHTML = "";

  stories.forEach((story, index) => {
    const item = document.createElement("div");
    item.className = "saved-story";

    const paragraph = document.createElement("p");
    paragraph.textContent = story;

    const button = document.createElement("button");
    button.textContent = "🗑️ Supprimer";
    button.onclick = () => deleteStory(index);

    item.append(paragraph, button);
    area.appendChild(item);
  });
}

function deleteStory(index) {
  const stories = JSON.parse(
    localStorage.getItem("frutanziaStories") || "[]"
  );

  stories.splice(index, 1);

  localStorage.setItem(
    "frutanziaStories",
    JSON.stringify(stories)
  );

  showStories();
}

showStories();
</script>

</body>
</html>
